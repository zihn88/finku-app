<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2156/2156079.png">

    <!-- MANIFEST DINAMIS -->
    <script>
        const manifest = {
            "name": "FinKu - Keuangan",
            "short_name": "FinKu",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#E2E8F0",

            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/2156/2156079.png","sizes": "512x512","type": "image/png"}]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        document.write('<link rel="manifest" href="'+manifestURL+'">');
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #E2E8F0; }
